name: Scheduled Article Publishing

on:
  schedule:
    # JST 07:00 = UTC 22:00 (前日)
    - cron: '0 22 * * *'
    # JST 12:00 = UTC 03:00
    - cron: '0 3 * * *'
    # JST 18:00 = UTC 09:00
    - cron: '0 9 * * *'
    # JST 21:00 = UTC 12:00
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 'Number of articles to publish'
        required: false
        default: '1'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Publish next article from queue
        run: python scripts/scheduled_publish.py ${{ github.event.inputs.count || '1' }}

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Install tweepy
        if: steps.check.outputs.changed == 'true'
        run: pip install tweepy

      - name: Tweet new articles
        if: steps.check.outputs.changed == 'true'
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
        run: python scripts/tweet_new_articles.py

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add articles/ publish-queue.txt .tweeted-articles
          git commit -m "chore: auto-publish article (scheduled)"
          git push
