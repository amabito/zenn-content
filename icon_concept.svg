<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Gaussian-like gradient -->
    <radialGradient id="gaussianGrad" cx="30%" cy="50%" r="70%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#c084fc;stop-opacity:0.3" />
    </radialGradient>

    <!-- Code pattern overlay -->
    <pattern id="codePattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <text x="2" y="10" font-family="monospace" font-size="6" fill="rgba(255,255,255,0.15)">{</text>
      <text x="10" y="18" font-family="monospace" font-size="6" fill="rgba(255,255,255,0.15)">}</text>
    </pattern>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#1e1b4b"/>

  <!-- Feather body with Gaussian gradient -->
  <path d="M100,20
           Q140,60 145,100
           Q148,140 100,180
           Q52,140 55,100
           Q60,60 100,20"
        fill="url(#gaussianGrad)"/>

  <!-- Code pattern overlay on feather -->
  <path d="M100,20
           Q140,60 145,100
           Q148,140 100,180
           Q52,140 55,100
           Q60,60 100,20"
        fill="url(#codePattern)"/>

  <!-- Feather spine (like a code bracket) -->
  <path d="M100,25 L100,175"
        stroke="#e0e7ff"
        stroke-width="3"
        stroke-linecap="round"
        fill="none"/>

  <!-- Feather barbs (like code indentation lines) -->
  <g stroke="#c7d2fe" stroke-width="1.5" stroke-linecap="round" opacity="0.7">
    <path d="M100,40 Q120,45 135,50"/>
    <path d="M100,40 Q80,45 65,50"/>
    <path d="M100,60 Q125,65 140,75"/>
    <path d="M100,60 Q75,65 60,75"/>
    <path d="M100,80 Q130,88 142,95"/>
    <path d="M100,80 Q70,88 58,95"/>
    <path d="M100,100 Q130,108 143,115"/>
    <path d="M100,100 Q70,108 57,115"/>
    <path d="M100,120 Q125,128 138,138"/>
    <path d="M100,120 Q75,128 62,138"/>
    <path d="M100,140 Q118,148 128,158"/>
    <path d="M100,140 Q82,148 72,158"/>
  </g>

  <!-- Small Gaussian splats (dots) -->
  <g fill="#f0abfc" opacity="0.6">
    <circle cx="130" cy="70" r="3"/>
    <circle cx="70" cy="70" r="2"/>
    <circle cx="140" cy="100" r="4"/>
    <circle cx="60" cy="100" r="3"/>
    <circle cx="125" cy="130" r="2"/>
    <circle cx="75" cy="130" r="3"/>
  </g>

  <!-- Accent: tiny code symbols -->
  <text x="150" y="60" font-family="monospace" font-size="12" fill="#a5b4fc" opacity="0.8">&lt;/&gt;</text>
  <text x="35" y="150" font-family="monospace" font-size="10" fill="#a5b4fc" opacity="0.6">{ }</text>
</svg>